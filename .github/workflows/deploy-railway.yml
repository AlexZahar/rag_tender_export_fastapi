name: Deploy to Railway

on:
  push:
    branches: [main]  # Adjust this to your main branch name if different

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # or PROD, depending on which environment you want to use

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Railway CLI
      run: npm i -g @railway/cli

    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
      run: |
        railway up --service "$RAILWAY_SERVICE_NAME" --detach

    - name: Run Railway service
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
      run: |
        railway run --service "$RAILWAY_SERVICE_NAME"