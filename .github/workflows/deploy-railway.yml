name: Deploy to Railway

on:
  push:
    branches: [main]  # Adjust this to your main branch name if different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Railway CLI
      run: npm i -g @railway/cli

    - name: Debug - Check RAILWAY_TOKEN
      run: |
        if [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
          echo "RAILWAY_TOKEN is set"
        else
          echo "RAILWAY_TOKEN is not set"
        fi

    - name: Build and push Docker image
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "RAILWAY_TOKEN length: ${#RAILWAY_TOKEN}"
        railway login
        railway up --detach

    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "RAILWAY_TOKEN length: ${#RAILWAY_TOKEN}"
        railway run --service ${{ secrets.RAILWAY_SERVICE_NAME }} --detach